@if (!ubicacion.tieneUbicacion()) {
  <div class="aviso" role="region" aria-label="Aviso de ubicación">
    <div class="container aviso__fila">
      <p>
        <i class="fa-solid fa-location-dot me-2"></i>Usamos tu ubicación para mostrarte planes cerca
        de ti. Sin ella no podemos buscar.
      </p>
      <div class="aviso__acciones">
        <button
          type="button"
          class="btn btn-primary btn-sm"
          (click)="permitir()"
          [disabled]="cargando"
        >
          Permitir
        </button>
      </div>
    </div>
    @if (mensaje !== '') {
      <div class="container">
        <p class="aviso__error">{{ mensaje }}</p>
      </div>
    }
  </div>
}
