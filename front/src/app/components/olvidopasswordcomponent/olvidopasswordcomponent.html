<section class="auth-pagina">
  <div class="card auth-tarjeta">
    <h1>Recupera tu contraseña</h1>
    <p class="sub">Te enviamos un enlace para crear una nueva. Vence en 30 minutos.</p>
    @if (exito !== '') {
      <div class="alerta alerta-ok" role="status">{{ exito }}</div>
      <a routerLink="/login" class="btn btn-primary btn-block">Volver a ingresar</a>
    } @else {
      @if (mensaje !== '') {
        <div class="alerta alerta-error" role="alert">{{ mensaje }}</div>
      }
      <form (ngSubmit)="enviar()" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            [class.invalido]="errorEmail !== ''"
            placeholder="el correo de tu cuenta"
            autocomplete="email"
          />
          @if (errorEmail !== '') {
            <span class="error">{{ errorEmail }}</span>
          }
        </div>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="enviando">
          {{ enviando ? 'Enviando...' : 'Enviar enlace' }}
        </button>
      </form>
      <p class="auth-pie"><a routerLink="/login">Volver a ingresar</a></p>
    }
  </div>
</section>
