<section class="auth-pagina">
  <div class="card auth-tarjeta">
    <h1>Recupera tu contraseña</h1>
    <p class="sub">Te enviamos un enlace para crear una nueva.</p>

    @if (exito()) {
      <div class="alerta alerta-ok" role="status">{{ exito() }}</div>
      <a routerLink="/login" class="btn btn-primary btn-block">Volver a ingresar</a>
    } @else {
      @if (error()) {
        <div class="alerta alerta-error" role="alert">{{ error() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input id="email" type="email" formControlName="email" autocomplete="email"
                 [class.invalido]="invalido()" />
          @if (invalido()) { <span class="error">Ingresa un correo válido.</span> }
        </div>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>
      <p class="auth-pie"><a routerLink="/login">Volver a ingresar</a></p>
    }
  </div>
</section>
