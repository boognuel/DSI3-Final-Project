<header class="barra">
  <div class="container barra__fila">
    <a routerLink="/" class="barra__logo" (click)="cerrar()">
      <img src="bogoparche.png" alt="Bogoparche" />
    </a>
    <button
      class="barra__toggle"
      type="button"
      aria-label="Abrir menú"
      [attr.aria-expanded]="abierto"
      (click)="alternar()"
    >
      <span></span><span></span><span></span>
    </button>
    <nav class="barra__menu" [class.abierto]="abierto">
      @if (sesion.activa()) {
        <a routerLink="/planes" routerLinkActive="activo" (click)="cerrar()">Buscar planes</a>
        <a routerLink="/salidas" routerLinkActive="activo" (click)="cerrar()">Mis salidas</a>
        <a routerLink="/perfil" routerLinkActive="activo" (click)="cerrar()">Perfil</a>
        @if (sesion.esAdmin()) {
          <a routerLink="/admin/usuarios" routerLinkActive="activo" (click)="cerrar()"
            >Administrar</a
          >
        }
      } @else {
        <a routerLink="/" fragment="planes" (click)="cerrar()">Planes</a>
        <a routerLink="/" fragment="rangos" (click)="cerrar()">Rangos de precio</a>
        <a routerLink="/" fragment="como-funciona" (click)="cerrar()">Cómo funciona</a>
        <a routerLink="/" fragment="contacto" (click)="cerrar()">Contacto</a>
      }
      <div class="barra__acciones">
        @if (sesion.activa()) {
          <span class="barra__usuario">Hola, {{ sesion.usuario() }}</span>
          <button class="btn btn-ghost btn-sm" type="button" (click)="salir()">Salir</button>
        } @else {
          <a routerLink="/login" class="btn btn-ghost btn-sm" (click)="cerrar()">Ingresar</a>
          <a routerLink="/register" class="btn btn-primary btn-sm" (click)="cerrar()"
            >Crear cuenta</a
          >
        }
      </div>
    </nav>
  </div>
</header>
