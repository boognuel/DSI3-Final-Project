<app-adminbarracomponent></app-adminbarracomponent>
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <h1 class="h3 mb-0">Estadísticas</h1>
    <form class="d-flex flex-wrap align-items-end gap-2" (ngSubmit)="descargar()" novalidate>
      <div>
        <label for="desde" class="form-label small mb-1">Desde</label>
        <input
          id="desde"
          name="desde"
          type="date"
          class="form-control form-control-sm"
          [class.is-invalid]="errorDesde !== ''"
          [(ngModel)]="desde"
        />
        <div class="invalid-feedback">{{ errorDesde }}</div>
      </div>
      <div>
        <label for="hasta" class="form-label small mb-1">Hasta</label>
        <input
          id="hasta"
          name="hasta"
          type="date"
          class="form-control form-control-sm"
          [class.is-invalid]="errorHasta !== ''"
          [(ngModel)]="hasta"
        />
        <div class="invalid-feedback">{{ errorHasta }}</div>
      </div>
      <button type="submit" class="btn btn-sm btn-acento" [disabled]="descargando">
        <i class="fa-solid fa-file-excel me-1"></i>Descargar reporte
      </button>
    </form>
  </div>
  @if (mensaje !== '') {
    <div class="alert alert-danger">{{ mensaje }}</div>
  }
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="tarjeta p-3">
        <h2 class="h6">Usuarios registrados por mes</h2>
        <canvas #usuarios></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="tarjeta p-3">
        <h2 class="h6">Lugares por categoría</h2>
        <canvas #lugares></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="tarjeta p-3">
        <h2 class="h6">Invitaciones por estado</h2>
        <canvas #invitaciones></canvas>
      </div>
    </div>
  </div>
</div>
